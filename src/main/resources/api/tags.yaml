openapi: 3.0.3
info:
  title: Tag Service API
  version: 1.0.0
  description: API for managing route tags in the Crimpit network.

tags:
  - name: Tags
    description: Operations related to route tags

paths:
  /tags:
    post:
      summary: Create a new tag
      operationId: createTag
      tags:
        - Tags
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagCreateRequest'
      responses:
        '201':
          description: Tag created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagResponse'
        '409':
          description: Tag already exists
    get:
      summary: List all tags
      operationId: listTags
      tags:
        - Tags
      responses:
        '200':
          description: List of tags
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TagResponse'

components:
  schemas:
    TagCreateRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 50
          description: Tag name
          example: "Slab"

    TagResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
