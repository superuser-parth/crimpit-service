spring:
  application:
    name: CRIMPIT

  datasource:
    # Indented 2 spaces under 'spring'
    url: jdbc:mysql://localhost:3306/gym_service_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: your_password

  flyway:
    # Indented 2 spaces under 'spring'
    enabled: true
    baseline-on-migrate: true


eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    # Ensure this is true for clients
    register-with-eureka: true
    fetch-registry: true


